# PostgreSQL veritabanı bağlantısı (ortam değişkenleriyle değiştirilebilir)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/koleksiyon_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA ve Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Resim yükleme limitleri (maksimum 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Geliştirme sırasında HTML değişiklikleri anında görünsün
spring.thymeleaf.cache=false

# İlk açılışta oluşturulan admin hesabının şifresi.
# Boş bırakılırsa rastgele bir şifre üretilir ve konsola yazılır.
app.admin.password=${ADMIN_PASSWORD:}
